name: "iOS: проверка сборки"

# Проверяет, что приложение и расширение виджетов компилируются (Swift 6, строгая проверка конкурентности).
# Подпись и выгрузка не выполняются — это делает отдельный ручной workflow «Выгрузка в TestFlight».
on:
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Сборка для симулятора"
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: "Проверка репозитория"
        uses: actions/checkout@v4

      - name: "Выбор Xcode"
        run: |
          # Самый новый из установленных Xcode_*.app (на образе их может быть несколько)
          XCODE="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version

      - name: "Разрешение зависимостей Swift Package Manager"
        working-directory: ./ios
        run: xcodebuild -resolvePackageDependencies -project NetPulse.xcodeproj -scheme NetPulse

      - name: "Сборка приложения и виджетов (симулятор, без подписи)"
        working-directory: ./ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | tail -n 40

      - name: "Ошибки компиляции"
        if: failure()
        working-directory: ./ios
        run: |
          echo "=== error: ==="
          grep -E "error:" build.log | sort -u | head -n 80 || true
