name: "Выгрузка в TestFlight (Apple App Store Connect)"

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Маркетинговая версия (например: 1.0.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Описание изменений для тестировщиков'
        required: false
        default: 'Релиз NetPulse: мониторинг сети, джиттер RFC 3550, Swift Charts и замер скорости Speedtest.'
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - '.github/workflows/testflight.yml'

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: "Сборка и доставка в TestFlight"
    runs-on: macos-14
    timeout-minutes: 30
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

    steps:
      - name: "Проверка репозитория"
        uses: actions/checkout@v4

      - name: "Выбор активной версии Xcode"
        run: |
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: "Настройка ключа App Store Connect API"
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: "Импорт сертификата Apple Distribution (при наличии)"
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'default_keychain_pass_123' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: "Сборка архива NetPulse.xcarchive"
        working-directory: ./ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          BUILD_NUM=${{ github.run_number }}
          VERSION="${{ github.event.inputs.version_name || '1.0.0' }}"
          
          xcrun agvtool new-version -all $BUILD_NUM || true
          xcrun agvtool new-marketing-version $VERSION || true

          # Сборка архива с автоматической загрузкой профилей
          xcodebuild archive \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NetPulse.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: "Экспорт и подпись IPA архива"
        working-directory: ./ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/IPA
          
          # Установка teamID в ExportOptions.plist
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/NetPulse.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/IPA \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: "Выгрузка в TestFlight"
        working-directory: ./ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          IPA_PATH=$(find build/IPA -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA файл не найден!"
            exit 1
          fi
          echo "✔ Найден IPA: $IPA_PATH ($(ls -lh "$IPA_PATH" | awk '{print $5}'))"

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

          echo "🚀 Сборка успешно отправлена на обработку в Apple TestFlight!"
