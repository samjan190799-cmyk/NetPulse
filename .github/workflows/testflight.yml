name: "Выгрузка в TestFlight (Apple App Store Connect)"

# Выгрузка в TestFlight запускается ТОЛЬКО вручную. Раньше любой push в ios/** на main автоматически отправлял
# сборку тестировщикам, а новый запуск отменял предыдущий (в том числе во время загрузки).
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Маркетинговая версия (например: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-upload:
    name: "Сборка и доставка в TestFlight"
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}

    steps:
      - name: "Проверка репозитория"
        uses: actions/checkout@v4

      - name: "Выбор Xcode 26 (iOS 26 SDK)"
        run: |
          echo "=== Доступные версии Xcode ==="
          ls /Applications/ | grep Xcode || true
          
          # Выбор Xcode 26+ (требуется Apple с 2026 года)
          if [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          else
            sudo xcode-select -s /Applications/Xcode.app
          fi
          
          echo "=== Активный Xcode ==="
          xcodebuild -version
          echo "=== Доступные SDK ==="
          xcodebuild -showsdks | grep iphoneos || true

      - name: "Генерация иконок приложения"
        working-directory: ./ios
        run: |
          ICONSET="Assets.xcassets/AppIcon.appiconset"

          # Каталог иконок лежит в репозитории: перезаписывать его нечем и незачем.
          # Генерация ниже — запасной путь на случай, если иконок в репозитории нет.
          if [ -f "$ICONSET/AppIcon-1024.png" ] && [ -f "$ICONSET/Contents.json" ]; then
            echo "✔ Иконки приложения уже в репозитории — генерация не требуется"
            exit 0
          fi

          python3 -m pip install --upgrade --break-system-packages Pillow --quiet
          mkdir -p "$ICONSET"
          
          # Если мастер-логотип существует в assets/, генерируем все размеры напрямую из него
          if [ -f "../assets/netpulse_logo.png" ]; then
            echo "🖼 Генерация иконок из официального мастер-логотипа ../assets/netpulse_logo.png"
            python3 -c "
          from PIL import Image
          master = Image.open('../assets/netpulse_logo.png').convert('RGBA')
          # Создаем непрозрачный фон для App Store (требование Apple: без альфа-канала)
          bg = Image.new('RGB', master.size, (10, 13, 20))
          if master.mode == 'RGBA':
              bg.paste(master, mask=master.split()[3])
          else:
              bg.paste(master)
          
          sizes = [20, 29, 40, 57, 58, 60, 76, 80, 87, 114, 120, 152, 167, 180, 1024]
          for sz in sizes:
              resized = bg.resize((sz, sz), Image.Resampling.LANCZOS)
              resized.save(f'$ICONSET/Icon-{sz}.png', 'PNG')
              if sz == 1024:
                  resized.save(f'$ICONSET/AppIcon-1024.png', 'PNG')
              elif sz == 120:
                  resized.save(f'$ICONSET/AppIcon-60@2x.png', 'PNG')
              elif sz == 180:
                  resized.save(f'$ICONSET/AppIcon-60@3x.png', 'PNG')
          print('Все размеры иконок успешно сформированы из netpulse_logo.png')
          " || true
          fi
          
          # Проверяем наличие ключевых иконок, если нет — генерируем фолбек
          generate_icon() {
            SIZE=$1
            FILENAME=$2
            if [ ! -f "$ICONSET/$FILENAME" ]; then
              python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new('RGB', ($SIZE, $SIZE), (10, 13, 20))
          draw = ImageDraw.Draw(img)
          font_size = max(int($SIZE * 0.55), 10)
          try:
              font = ImageFont.truetype('/System/Library/Fonts/Helvetica.ttc', font_size)
          except:
              font = ImageFont.load_default()
          bbox = draw.textbbox((0,0), 'N', font=font)
          w = bbox[2] - bbox[0]
          h = bbox[3] - bbox[1]
          x = ($SIZE - w) // 2 - bbox[0]
          y = ($SIZE - h) // 2 - bbox[1]
          draw.text((x, y), 'N', font=font, fill=(255,255,255))
          img.save('$ICONSET/$FILENAME', 'PNG')
          " 2>/dev/null || true
            fi
          }
          
          for s in 20 29 40 57 58 60 76 80 87 114 120 152 167 180 1024; do
            generate_icon $s "Icon-$s.png"
          done
          generate_icon 1024 "AppIcon-1024.png"
          generate_icon 120 "AppIcon-60@2x.png"
          generate_icon 180 "AppIcon-60@3x.png"
          
          # Запись универсального Contents.json
          cat > "$ICONSET/Contents.json" << 'CONTENTS_EOF'
          {
            "images" : [
              { "idiom" : "universal", "platform" : "ios", "size" : "1024x1024", "filename" : "AppIcon-1024.png" },
              { "idiom" : "universal", "platform" : "ios", "scale" : "2x", "size" : "60x60", "filename" : "AppIcon-60@2x.png" },
              { "idiom" : "universal", "platform" : "ios", "scale" : "3x", "size" : "60x60", "filename" : "AppIcon-60@3x.png" },
              { "idiom" : "iphone", "scale" : "2x", "size" : "20x20",  "filename" : "Icon-40.png"   },
              { "idiom" : "iphone", "scale" : "3x", "size" : "20x20",  "filename" : "Icon-60.png"   },
              { "idiom" : "iphone", "scale" : "2x", "size" : "29x29",  "filename" : "Icon-58.png"   },
              { "idiom" : "iphone", "scale" : "3x", "size" : "29x29",  "filename" : "Icon-87.png"   },
              { "idiom" : "iphone", "scale" : "2x", "size" : "40x40",  "filename" : "Icon-80.png"   },
              { "idiom" : "iphone", "scale" : "3x", "size" : "40x40",  "filename" : "Icon-120.png"  },
              { "idiom" : "iphone", "scale" : "2x", "size" : "60x60",  "filename" : "Icon-120.png"  },
              { "idiom" : "iphone", "scale" : "3x", "size" : "60x60",  "filename" : "Icon-180.png"  },
              { "idiom" : "ipad",   "scale" : "1x", "size" : "20x20",  "filename" : "Icon-20.png"   },
              { "idiom" : "ipad",   "scale" : "2x", "size" : "20x20",  "filename" : "Icon-40.png"   },
              { "idiom" : "ipad",   "scale" : "1x", "size" : "29x29",  "filename" : "Icon-29.png"   },
              { "idiom" : "ipad",   "scale" : "2x", "size" : "29x29",  "filename" : "Icon-58.png"   },
              { "idiom" : "ipad",   "scale" : "1x", "size" : "40x40",  "filename" : "Icon-40.png"   },
              { "idiom" : "ipad",   "scale" : "2x", "size" : "40x40",  "filename" : "Icon-80.png"   },
              { "idiom" : "ipad",   "scale" : "1x", "size" : "76x76",  "filename" : "Icon-76.png"   },
              { "idiom" : "ipad",   "scale" : "2x", "size" : "76x76",  "filename" : "Icon-152.png"  },
              { "idiom" : "ipad",   "scale" : "2x", "size" : "83.5x83.5", "filename" : "Icon-167.png" },
              { "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024", "filename" : "AppIcon-1024.png" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          CONTENTS_EOF
          
          echo "=== Сгенерированные иконки ==="
          ls -la "$ICONSET/"
          echo "✔ Иконки сгенерированы успешно"

      - name: "Настройка ключа App Store Connect API"
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$API_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

      - name: "Импорт сертификата Apple Distribution (при наличии)"
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: "Сборка архива NetPulse.xcarchive"
        working-directory: ./ios
        env:
          # Значения из inputs передаются через окружение, а не подставляются в текст скрипта (защита от инъекции команд)
          VERSION_NAME: ${{ github.event.inputs.version_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "❌ Некорректная версия: '$VERSION_NAME' (ожидается вид 1.0.0)"
            exit 1
          fi

          # Версия и номер сборки задаются настройками сборки для обоих таргетов (приложение и виджеты);
          # Info.plist читают их через $(MARKETING_VERSION) и $(CURRENT_PROJECT_VERSION).
          # Раньше agvtool с `|| true` молча не срабатывал, а в plist были зашиты 1.0.0 и 1.
          xcodebuild archive \
            -project NetPulse.xcodeproj \
            -scheme NetPulse \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/NetPulse.xcarchive \
            MARKETING_VERSION="$VERSION_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          # Внедрение CFBundleIconName в скомпилированный Info.plist архива
          ARCHIVE_PLIST="build/NetPulse.xcarchive/Products/Applications/NetPulse.app/Info.plist"
          if [ -f "$ARCHIVE_PLIST" ]; then
            echo "✔ Внедрение CFBundleIconName в $ARCHIVE_PLIST"
            plutil -replace CFBundleIconName -string "AppIcon" "$ARCHIVE_PLIST"
          fi

      - name: "Фреймворки в архиве: снять подпись линкера (ad hoc)"
        working-directory: ./ios
        run: |
          # Статическую библиотеку (например, рекламу Яндекса) Xcode 26 кладёт в приложение «бескодовым» фреймворком
          # и вставляет в него пустую заглушку, подписанную линкером (ad hoc). Архив собирается без подписи, и экспорт
          # такую готовую подпись оставляет как есть: Apple отклоняет сборку («Invalid Signature … not properly signed»).
          # Снимаем подпись линкера, чтобы экспорт подписал заглушку сертификатом распространения.
          APP="build/NetPulse.xcarchive/Products/Applications/NetPulse.app"
          shopt -s nullglob
          for fw in "$APP"/Frameworks/*.framework; do
            name="$(basename "$fw" .framework)"
            exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$fw/Info.plist" 2>/dev/null || echo "$name")"
            bin="$fw/$exe"
            if [ ! -f "$bin" ]; then
              echo "• $name: бинарного файла нет"
              continue
            fi
            sig="$(codesign -dv --verbose=2 "$bin" 2>&1 | grep -E '^Signature=|^CodeDirectory' | tr '\n' ' ' || true)"
            echo "• $name: ${sig:-не подписан}"
            if echo "$sig" | grep -qi "adhoc"; then
              codesign --remove-signature "$bin"
              echo "    подпись линкера снята: подписать заглушку должен экспорт"
            fi
          done

      - name: "Экспорт и подпись IPA через App Store Connect API"
        working-directory: ./ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build/IPA
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath build/NetPulse.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/IPA \
            -allowProvisioningUpdates \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: "Проверка подписи в готовом IPA (до выгрузки)"
        working-directory: ./ios
        run: |
          # Apple отклоняет сборку, если любой встроенный код подписан не сертификатом распространения.
          # Проверяем это здесь, чтобы не тратить время на заведомо неудачную выгрузку.
          set -e
          rm -rf build/ipa_check && mkdir -p build/ipa_check
          IPA_PATH=$(find build/IPA -name "*.ipa" | head -n 1)
          unzip -q "$IPA_PATH" -d build/ipa_check
          APP="$(echo build/ipa_check/Payload/*.app)"
          shopt -s nullglob
          bad=0
          check() {
            info="$(codesign -dvv "$1" 2>&1 || true)"
            auth="$(echo "$info" | grep -E '^Authority=' | head -n 1 || true)"
            team="$(echo "$info" | grep -E '^TeamIdentifier=' | head -n 1 || true)"
            echo "• $2: ${auth:-без Authority} ${team:+| $team}"
            if echo "$info" | grep -qE 'Signature=adhoc|not signed at all' || [ -z "$auth" ]; then
              bad=1
            fi
          }
          check "$APP" "приложение"
          for item in "$APP"/Frameworks/*.framework "$APP"/PlugIns/*.appex; do
            check "$item" "$(basename "$item")"
          done
          if [ "$bad" -ne 0 ]; then
            echo "❌ Часть кода в IPA подписана не сертификатом распространения (ad hoc или без подписи): Apple отклонит сборку"
            exit 1
          fi
          echo "✔ Весь код в IPA подписан сертификатом распространения"

      - name: "Выгрузка в TestFlight"
        working-directory: ./ios
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -eo pipefail
          IPA_PATH=$(find build/IPA -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA файл не найден!"
            exit 1
          fi
          echo "✔ Найден IPA: $IPA_PATH ($(ls -lh "$IPA_PATH" | awk '{print $5}'))"

          # altool при отказе Apple печатает «UPLOAD FAILED», но завершается с кодом 0 — проверяем вывод сами
          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            --type ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID" 2>&1 | tee build/altool.log

          if grep -qE "UPLOAD FAILED|Failed to upload package" build/altool.log; then
            echo "❌ Apple отклонила загрузку (причина выше). Сборка НЕ отправлена."
            exit 1
          fi

          echo "🚀 Сборка успешно отправлена в Apple TestFlight!"
