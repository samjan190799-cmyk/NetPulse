<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121620" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- The Geometric N-Wave Single-Gesture Stroke -->
  <g transform="translate(40, 20)">
    <path d="M 80 340 
             L 155 175 
             C 168 145, 196 145, 208 175 
             L 245 285 
             C 255 315, 275 315, 285 285 
             L 320 165 
             C 330 135, 350 135, 360 165 
             L 385 275 
             C 392 300, 408 300, 418 275 
             L 435 240 
             C 445 220, 465 225, 455 248 
             L 435 295 
             C 415 340, 385 340, 368 295 
             L 345 205 
             L 315 310 
             C 298 355, 268 355, 252 310 
             L 215 200 
             L 145 355 
             C 135 375, 105 385, 80 340 Z" 
          fill="url(#glyphGrad)" 
          filter="url(#glow)" />
  </g>
</svg>
