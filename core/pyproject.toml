[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "Легковесный инструмент мониторинга качества сетевого соединения в реальном времени"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NetPulse Engineering Team" }
]
dependencies = [
    "rich>=13.7.0",
    "aiohttp>=3.9.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "psutil>=5.9.8",
]

[project.scripts]
netpulse = "main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
