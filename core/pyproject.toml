[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netpulse"
version = "1.0.0"
description = "Легковесный инструмент мониторинга качества сетевого соединения в реальном времени"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "NetPulse Engineering Team" }
]
# Только то, что реально импортируется. Без fastapi/uvicorn веб-интерфейс работает на встроенном http.server.
dependencies = [
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
netpulse = "main:main"

# Плоская раскладка: main.py + несколько пакетов. Без явного перечня setuptools отказывается
# собирать проект («Multiple top-level packages discovered in a flat-layout»).
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["config*", "engine*", "metrics*", "ui*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
ui = ["templates/*.html", "static/*.*", "static/vendor/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Ошибки синтаксиса, pyflakes (неиспользуемые/неопределённые имена) и flake8-bugbear
select = ["E9", "F", "B"]
